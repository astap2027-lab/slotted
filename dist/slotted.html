<title>Slotted</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#101214">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   Slotted design system
   One family (Archivo) at three widths: expanded for headings, condensed for
   numbers, normal for reading. Dark graphite by default, electric lime for
   action and progress, amber for sport and warnings.
   ========================================================================= */

:root {
  --bg: #101214;
  --surface: #181b1e;
  --surface-2: #202428;
  --surface-3: #2a2f34;
  --line: #2a2f34;
  --line-2: #3a4047;
  --text: #eef1ec;
  --text-2: #a2aab0;
  --text-3: #737b82;
  --lime: #c5f23d;
  --lime-ink: #121509;
  --lime-text: #c5f23d;
  --lime-soft: rgba(197, 242, 61, 0.12);
  --lime-line: rgba(197, 242, 61, 0.42);
  --amber: #f2a33a;
  --amber-text: #f5b65e;
  --amber-soft: rgba(242, 163, 58, 0.14);
  --danger: #ff7a6b;
  --danger-soft: rgba(255, 122, 107, 0.12);
  --school: #6c7782;
  --school-soft: rgba(108, 119, 130, 0.22);
  --work: #6b8db2;
  --work-soft: rgba(107, 141, 178, 0.2);
  --other: #9a86b8;
  --other-soft: rgba(154, 134, 184, 0.2);
  --strava: #fc4c02;
  --focus: #9fd8ff;
  /* recovery: recovered tints toward lime, worked muscles run amber to red-orange */
  --rec-0: #3f4a24;
  --rec-1: #b98a3a;
  --rec-2: #d9762f;
  --rec-3: #f05a3a;
  --fig: #2b3036;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  --font: 'Archivo', 'Arial', system-ui, sans-serif;
  --r-lg: 18px;
  --r-md: 12px;
  --r-sm: 8px;
  --side: 248px;
  color-scheme: dark;
}

:root[data-theme='light'] {
  --bg: #f2f3ef;
  --surface: #ffffff;
  --surface-2: #f1f3ee;
  --surface-3: #e6e9e2;
  --line: #e2e5de;
  --line-2: #cbd0c7;
  --text: #121416;
  --text-2: #515a62;
  --text-3: #7a828a;
  --lime: #c5f23d;
  --lime-ink: #121509;
  --lime-text: #4a7300;
  --lime-soft: rgba(116, 168, 0, 0.12);
  --lime-line: rgba(90, 140, 0, 0.45);
  --amber: #e08a14;
  --amber-text: #9a5a00;
  --amber-soft: rgba(224, 138, 20, 0.14);
  --danger: #c4372a;
  --danger-soft: rgba(196, 55, 42, 0.1);
  --school: #8a949e;
  --school-soft: rgba(138, 148, 158, 0.2);
  --work: #5b80a8;
  --work-soft: rgba(91, 128, 168, 0.16);
  --other: #8a74a8;
  --other-soft: rgba(138, 116, 168, 0.16);
  --focus: #1f6fd1;
  --rec-0: #d6ebae;
  --rec-1: #f0c27a;
  --rec-2: #e88a45;
  --rec-3: #d9502f;
  --fig: #dfe3dc;
  --shadow: 0 18px 50px rgba(20, 24, 28, 0.14);
  color-scheme: light;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 16px/1.55 var(--font); font-stretch: 100%;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
img, svg { display: block; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
p { margin: 0; }
h1, h2, h3, h4 { margin: 0; font-weight: 800; line-height: 1.04; letter-spacing: -0.01em; text-wrap: balance; }
h1 { font-size: clamp(30px, 4vw, 42px); font-stretch: 125%; letter-spacing: -0.02em; }
h2 { font-size: 22px; font-stretch: 118%; }
h3 { font-size: 18px; font-stretch: 112%; }
.num { font-stretch: 75%; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.small { font-size: 14px; }
.label { font-size: 13.5px; color: var(--text-2); font-weight: 500; }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.errors { color: var(--danger); font-size: 14px; }
.errors:empty { display: none; }

/* ---------- shell ---------- */
.shell { min-height: 100vh; min-height: 100dvh; }
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--side); z-index: 20;
  display: flex; flex-direction: column; gap: 28px; padding: 24px 16px 20px;
  background: var(--bg); border-right: 1px solid var(--line);
}
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; padding: 0 10px; }
.brand-mark { width: 26px; height: 26px; }
.brand-name { font-weight: 800; font-stretch: 125%; font-size: 21px; letter-spacing: -0.02em; }
.nav { display: grid; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: var(--r-md);
  text-decoration: none; font-weight: 600; color: var(--text-2); transition: background-color .15s, color .15s;
}
.nav a:hover { color: var(--text); background: var(--surface); }
.nav a[aria-current='page'] { color: var(--text); background: var(--surface-2); box-shadow: inset 3px 0 0 var(--lime); }
.nav a[aria-current='page'] .ico { color: var(--lime-text); }
.ico { width: 22px; height: 22px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.side-week { margin-top: auto; padding: 14px; border-radius: var(--r-md); background: var(--surface); display: grid; gap: 10px; text-decoration: none; }
.side-week b { font-size: 15px; }
.side-week:empty { display: none; }
.mtop { display: none; }
.main { margin-left: var(--side); }
main#app { max-width: 1180px; margin: 0 auto; padding: 36px 40px 120px; outline: none; }
main#app.enter { animation: enter .22s ease-out; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

body.setup .sidebar, body.setup .mtop-nav { display: none; }
body.setup .main { margin-left: 0; }

@media (max-width: 900px) {
  .sidebar {
    inset: auto 0 0 0; width: auto; height: auto; flex-direction: row; gap: 0; padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
    border-right: 0; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .sidebar .brand, .side-week { display: none; }
  .nav { grid-template-columns: repeat(5, minmax(0, 1fr)); width: 100%; }
  .nav a { flex-direction: column; gap: 3px; padding: 7px 2px 5px; font-size: 12px; font-weight: 600; border-radius: 10px; text-align: center; }
  .nav a[aria-current='page'] { background: transparent; box-shadow: none; color: var(--lime-text); }
  .nav a span { white-space: nowrap; }
  .mtop {
    display: flex; position: sticky; top: 0; z-index: 15; align-items: center; justify-content: space-between;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line);
  }
  .main { margin-left: 0; }
  main#app { padding: 20px 16px calc(110px + env(safe-area-inset-bottom, 0px)); }
}
body.focus .sidebar { display: none; }
body.focus .main { margin-left: 0; }
body.focus .mtop { display: none; }

/* ---------- page header and sub navigation ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; margin-bottom: 24px; }
.page-head .page-sub { margin-top: 8px; color: var(--text-2); font-size: 16px; }
.page-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.subnav { display: inline-flex; gap: 4px; padding: 4px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); margin-bottom: 22px; max-width: 100%; overflow-x: auto; }
.subnav a { padding: 8px 16px; border-radius: 9px; font-weight: 600; font-size: 15px; text-decoration: none; color: var(--text-2); white-space: nowrap; }
.subnav a:hover { color: var(--text); }
.subnav a[aria-current='page'] { background: var(--surface-3); color: var(--text); }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 40px 0 14px; }
.sec-head h2 { font-size: 22px; }
.sec-head a, .card-head a { font-size: 14px; font-weight: 600; color: var(--lime-text); text-decoration: none; }
.sec-head a:hover, .card-head a:hover { text-decoration: underline; }

/* ---------- controls ---------- */
button, .btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font: 600 15px/1 var(--font); color: var(--text); text-decoration: none; white-space: nowrap;
  background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r-sm);
  padding: 11px 16px; min-height: 44px; cursor: pointer; transition: background-color .15s, border-color .15s, color .15s, transform .1s;
}
button:hover, .btn:hover { border-color: var(--text-3); }
button:active, .btn:active { transform: translateY(1px); }
.primary { background: var(--lime); color: var(--lime-ink); border-color: var(--lime); }
.primary:hover { background: #d4ff52; border-color: #d4ff52; }
:root[data-theme='light'] .primary:hover { background: #b7e62a; border-color: #b7e62a; }
.ghost { background: transparent; border-color: transparent; color: var(--text-2); padding: 9px 12px; min-height: 40px; }
.ghost:hover { color: var(--text); background: var(--surface-2); border-color: transparent; }
.danger { color: var(--danger); }
.big { min-height: 54px; padding: 15px 26px; font-size: 17px; border-radius: var(--r-md); }
.btn .ico, button .ico { width: 18px; height: 18px; }
label { font-weight: 500; }
input[type=text], input[type=time], input[type=number], input[type=email], select, textarea {
  font: 400 16px/1.25 var(--font); color: var(--text); background: var(--surface-2);
  border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 10px 12px; min-height: 46px; width: 100%;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--lime-line); box-shadow: 0 0 0 3px var(--lime-soft); }
input::placeholder, textarea::placeholder { color: var(--text-3); opacity: 1; }
select { appearance: none; -webkit-appearance: none; padding-right: 36px; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%), linear-gradient(135deg, var(--text-2) 50%, transparent 50%);
  background-position: calc(100% - 18px) 52%, calc(100% - 13px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
.field { display: grid; gap: 6px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.row > .field { flex: 1 1 140px; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { font-weight: 600; margin-bottom: 10px; padding: 0; }
.hint { color: var(--text-2); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip span {
  display: inline-flex; flex-direction: column; justify-content: center; gap: 2px; min-height: 44px;
  padding: 9px 14px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--surface-2);
  cursor: pointer; font-weight: 600; transition: background-color .15s, border-color .15s;
}
.chip small { font-weight: 400; color: var(--text-2); font-size: 13.5px; }
.chip input:checked + span { border-color: var(--lime-line); background: var(--lime-soft); box-shadow: inset 0 0 0 1px var(--lime-line); }
.chip input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
.chips.days .chip span { min-width: 54px; align-items: center; }

.switch { display: inline-flex; align-items: center; gap: 10px; background: transparent; border: 0; padding: 8px 2px; font-weight: 600; color: var(--text-2); }
.switch:hover { border: 0; color: var(--text); }
.switch .track { position: relative; width: 40px; height: 24px; border-radius: 12px; background: var(--surface-3); transition: background-color .2s; }
.switch .track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--text); transition: transform .2s; }
.switch[aria-checked='true'] { color: var(--text); }
.switch[aria-checked='true'] .track { background: var(--amber); }
.switch[aria-checked='true'] .track::after { transform: translateX(16px); background: #1b1307; }

.seg { display: inline-flex; padding: 3px; gap: 3px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.seg button { min-height: 34px; padding: 6px 12px; border: 0; background: transparent; font-size: 14px; color: var(--text-2); border-radius: 7px; }
.seg button[aria-pressed='true'], .seg button[aria-selected='true'] { background: var(--surface-3); color: var(--text); }

/* ---------- surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 16px; }
.card-head h2 { font-size: 19px; }
.stack > * + * { margin-top: 14px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 960px) { .grid2 { grid-template-columns: 1fr; } }
.callout { background: var(--amber-soft); color: var(--amber-text); padding: 13px 16px; border-radius: var(--r-md); font-size: 15px; }
.callout a { font-weight: 600; }
.warnings { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; }
.warnings li { background: var(--amber-soft); color: var(--amber-text); padding: 11px 14px; border-radius: var(--r-md); font-size: 15px; }
.confirm { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.empty-state { display: grid; gap: 10px; justify-items: start; padding: 28px; }
.empty-state h2 { font-size: 22px; }

/* badges and tags */
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; background: var(--surface-3); color: var(--text-2); }
.badge.done { background: var(--lime-soft); color: var(--lime-text); }
.badge.today { background: var(--lime); color: var(--lime-ink); }
.badge.missed { background: var(--danger-soft); color: var(--danger); }
.badge.sport { background: var(--amber-soft); color: var(--amber-text); }
.badge.busy { background: var(--amber-soft); color: var(--amber-text); }
.notes { display: flex; flex-wrap: wrap; gap: 6px; }
.note { font-size: 13.5px; padding: 4px 10px; border-radius: 999px; background: var(--amber-soft); color: var(--amber-text); font-weight: 500; }
.note.short { background: var(--surface-3); color: var(--text-2); }
.mchips { display: flex; flex-wrap: wrap; gap: 6px; }
.mchip { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600; padding: 5px 10px 5px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.mchip b { font-weight: 700; color: var(--text-2); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; background: var(--rec-0); }
.sw.l1 { background: var(--rec-1); } .sw.l2 { background: var(--rec-2); } .sw.l3 { background: var(--rec-3); }
.sw.none { background: var(--fig); }

/* meters */
.meter { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.meter > i { display: block; height: 100%; width: var(--w, 0%); background: var(--lime); border-radius: 3px; transition: width .5s cubic-bezier(.2, .8, .2, 1); }
.meter.sport > i { background: var(--amber); }

/* ---------- stats ---------- */
.stats-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1100px) { .stats-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px 18px 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.stat .num { font-size: 44px; line-height: 0.9; }
.stat .num small { font-size: 20px; font-stretch: 100%; font-weight: 600; color: var(--text-2); margin-left: 4px; letter-spacing: 0; }
.stat .stat-sub { font-size: 14px; color: var(--text-2); }
.stat .up { color: var(--lime-text); font-weight: 600; }
.stat .down { color: var(--text-2); font-weight: 600; }
@media (max-width: 520px) { .stat { padding: 14px; } .stat .num { font-size: 36px; } }

/* ---------- the week as slots ---------- */
.slots { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.slot { display: grid; gap: 8px; text-decoration: none; padding: 10px 8px 12px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid transparent; min-width: 0; transition: border-color .15s, background-color .15s; }
a.slot:hover { border-color: var(--line-2); }
.slot-top { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
.slot-day { font-weight: 700; font-size: 14px; }
.slot-date { font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.slot-bar { height: 54px; border-radius: 6px; background: var(--bg); border: 1px dashed var(--line-2); position: relative; overflow: hidden; }
.slot.has-session .slot-bar { border: 1px solid var(--lime-line); background: transparent; }
.slot.is-done .slot-bar { background: var(--lime); border-color: var(--lime); }
.slot.is-done .slot-bar::after { content: ''; position: absolute; left: 50%; top: 50%; width: 9px; height: 16px; border: solid var(--lime-ink); border-width: 0 3px 3px 0; transform: translate(-50%, -62%) rotate(45deg); }
.slot.is-missed .slot-bar { border: 1px solid var(--danger); background: var(--danger-soft); }
.slot.has-sport .slot-bar::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--amber); }
.slot.is-today { border-color: var(--lime-line); background: var(--surface-3); }
.slot.is-today .slot-day { color: var(--lime-text); }
.slot-name { font-size: 13px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-2); }
.slot.has-session .slot-name { color: var(--text); }
@media (max-width: 560px) {
  .slots { gap: 4px; }
  .slot { padding: 8px 4px 10px; gap: 6px; }
  .slot-top { flex-direction: column; align-items: center; gap: 0; }
  .slot-name { display: none; }
  .slot-bar { height: 40px; }
}
.slot-key { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; font-size: 13.5px; color: var(--text-2); }
.slot-key span { display: inline-flex; align-items: center; gap: 6px; }
.slot-key i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* ---------- Home ---------- */
.home-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px 28px; flex-wrap: wrap; margin-bottom: 26px; }
.home-head h1 { font-size: clamp(34px, 5vw, 52px); }
.home-head .page-sub { margin-top: 10px; font-size: 17px; color: var(--text-2); }
.home-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; margin-top: 18px; align-items: start; }
.home-grid > .span { grid-column: 1 / -1; }
@media (max-width: 1020px) { .home-grid { grid-template-columns: 1fr; } }

/* the one loud surface: today's workout */
.hero {
  position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 26px 26px 22px; display: grid; gap: 16px; overflow: hidden;
}
.hero::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--lime); }
.hero .hero-when { font-weight: 600; color: var(--lime-text); font-size: 15px; }
.hero h2 { font-size: clamp(30px, 4.2vw, 46px); font-stretch: 125%; letter-spacing: -0.02em; line-height: 0.98; }
.hero-facts { display: flex; flex-wrap: wrap; gap: 10px 28px; }
.hero-facts div { display: grid; gap: 2px; }
.hero-facts dt { font-size: 13.5px; color: var(--text-2); }
.hero-facts dd { margin: 0; font-size: 24px; line-height: 1; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.hero.rest-day::before { background: var(--line-2); }
.hero.rest-day h2 { font-size: clamp(26px, 3.4vw, 36px); }
@media (max-width: 520px) { .hero { padding: 20px 18px 18px; } .hero .big { flex: 1 1 100%; } }

.uplist { list-style: none; margin: 0; padding: 0; display: grid; }
.uplist li { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.uplist li:first-child { border-top: 0; padding-top: 0; }
.uplist .when { display: grid; line-height: 1.1; }
.uplist .when b { font-size: 15px; }
.uplist .when small { color: var(--text-3); font-size: 13px; }
.uplist .what { min-width: 0; display: grid; gap: 1px; }
.uplist .what b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.uplist .what small { color: var(--text-2); font-size: 13.5px; }
.uplist a { text-decoration: none; }
.uplist .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 6px; }

.snapshot { display: grid; gap: 18px; }
.pr-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.pr-list li { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.pr-list b { font-weight: 600; }
.pr-list .num { font-size: 20px; }

/* ---------- bars (sessions and volume per week) ---------- */
.bars { display: flex; align-items: flex-end; gap: 6px; height: 150px; padding-top: 22px; }
.bars.short { height: 96px; padding-top: 18px; }
.bar-col { flex: 1 1 0; min-width: 0; display: grid; grid-template-rows: 1fr auto; gap: 6px; height: 100%; }
.bar { position: relative; display: flex; align-items: flex-end; border-radius: 6px 6px 3px 3px; background: var(--surface-2); }
.bar-fill { width: 100%; height: var(--h, 0%); min-height: 2px; background: var(--lime); border-radius: 6px 6px 3px 3px; transition: height .5s cubic-bezier(.2, .8, .2, 1); }
.bar-fill.low { background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--line-2); }
.bar-target { position: absolute; left: -2px; right: -2px; bottom: var(--t); border-top: 2px dashed var(--text-3); }
.bar-val { position: absolute; left: 0; right: 0; bottom: calc(var(--h, 0%) + 3px); text-align: center; font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text-2); }
.bar-label { text-align: center; font-size: 12.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; }
.bar-col.current .bar-label { color: var(--text); font-weight: 600; }
.bars-key { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13.5px; color: var(--text-2); margin-top: 10px; }
.bars-key span { display: inline-flex; align-items: center; gap: 6px; }
.bars-key i { display: inline-block; width: 14px; height: 10px; border-radius: 2px; background: var(--lime); }
.bars-key i.target { height: 0; border-top: 2px dashed var(--text-3); background: none; }

.hbars { display: grid; gap: 10px; }
.hbar { display: grid; grid-template-columns: 96px minmax(0, 1fr) 54px; gap: 12px; align-items: center; font-size: 14.5px; }
.hbar .track { height: 12px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.hbar .track i { display: block; height: 100%; width: var(--w); background: var(--lime); border-radius: 3px; transition: width .5s cubic-bezier(.2, .8, .2, 1); }
.hbar .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--text-2); }

/* ---------- Training: This week ---------- */
.week-strip { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px 26px; align-items: center; }
.week-strip .big-count { display: flex; align-items: baseline; gap: 8px; }
.week-strip .big-count .num { font-size: 56px; line-height: 0.85; }
.week-strip .big-count span { color: var(--text-2); font-weight: 600; }
.week-strip .wk-meter { display: grid; gap: 8px; }
.week-strip .facts { display: flex; gap: 22px; }
.week-strip .facts div { display: grid; gap: 1px; }
.week-strip .facts dt { font-size: 13px; color: var(--text-2); }
.week-strip .facts dd { margin: 0; font-size: 22px; line-height: 1.05; }
@media (max-width: 720px) { .week-strip { grid-template-columns: 1fr; gap: 14px; } }
.streak-pop { animation: pop .6s cubic-bezier(.2, .8, .2, 1.4); display: inline-block; }
@keyframes pop { 40% { transform: scale(1.18); } }

.next-card { margin-top: 18px; }
.next-card .exprev { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px 22px; }
.exprev li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }
.exprev li span:last-child { color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* calendar */
.cal { display: grid; grid-template-columns: 44px repeat(7, minmax(0, 1fr)); gap: 0 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 16px 16px 8px; }
.cal-head { text-align: center; padding-bottom: 10px; display: grid; gap: 2px; text-decoration: none; }
.cal-head b { font-size: 15px; font-weight: 700; }
.cal-head small { font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.cal-head.is-today b { color: var(--lime-text); }
.cal-head .restlabel { font-size: 12px; color: var(--text-3); }
.cal-axis { position: relative; }
.cal-axis span { position: absolute; right: 8px; transform: translateY(-50%); font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.cal-col { position: relative; border-radius: 8px; background: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px calc(var(--hour) * 2)); }
.cal-col.is-today { background-color: color-mix(in srgb, var(--lime) 5%, transparent); box-shadow: inset 0 0 0 1px var(--lime-line); }
.cal-col.skipped { background-image: repeating-linear-gradient(135deg, transparent 0 7px, var(--line) 7px 8px); }
.blk { position: absolute; left: 2px; right: 2px; border-radius: 7px; overflow: hidden; padding: 5px 7px; font-size: 13px; line-height: 1.2; text-decoration: none; display: block; }
.blk b { display: block; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk .t { font-size: 12px; opacity: 0.85; white-space: nowrap; font-variant-numeric: tabular-nums; }
.blk.school { background: var(--school-soft); color: var(--text-2); box-shadow: inset 3px 0 0 var(--school); }
.blk.work { background: var(--work-soft); color: var(--text); box-shadow: inset 3px 0 0 var(--work); }
.blk.other { background: var(--other-soft); color: var(--text); box-shadow: inset 3px 0 0 var(--other); }
.blk.sport { background: var(--amber-soft); color: var(--amber-text); box-shadow: inset 3px 0 0 var(--amber); }
.blk.strava { background-image: repeating-linear-gradient(135deg, transparent 0 5px, rgba(252, 76, 2, 0.18) 5px 7px); box-shadow: inset 3px 0 0 var(--strava); }
.blk.train { background: var(--lime); color: var(--lime-ink); z-index: 2; }
.blk.train:hover { filter: brightness(1.06); }
.blk.train.done { background: var(--lime-soft); color: var(--lime-text); box-shadow: inset 0 0 0 1px var(--lime-line); }
.blk.train.missed { background: var(--danger-soft); color: var(--danger); box-shadow: inset 0 0 0 1px var(--danger); }
.blk.tight .t { display: none; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13.5px; color: var(--text-2); margin-top: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
.strava-line { font-size: 14px; color: var(--text-2); margin-top: 8px; }

/* phones get a day-by-day agenda instead of the time grid */
.agenda { display: none; list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.agenda > li { display: grid; grid-template-columns: 50px minmax(0, 1fr); gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
.agenda > li:first-child { border-top: 0; }
.agenda .a-day { display: grid; line-height: 1.15; }
.agenda .a-day b { font-size: 15px; }
.agenda .a-day small { color: var(--text-3); font-size: 13px; }
.agenda > li.is-today .a-day b { color: var(--lime-text); }
.agenda .a-items { display: grid; gap: 6px; min-width: 0; }
.a-item { display: flex; justify-content: space-between; gap: 10px; padding: 7px 10px; border-radius: 8px; font-size: 14.5px; text-decoration: none; min-width: 0; }
.a-item span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.a-item span:last-child { white-space: nowrap; font-variant-numeric: tabular-nums; opacity: 0.85; }
.a-item.school { background: var(--school-soft); box-shadow: inset 3px 0 0 var(--school); color: var(--text-2); }
.a-item.work { background: var(--work-soft); box-shadow: inset 3px 0 0 var(--work); }
.a-item.other { background: var(--other-soft); box-shadow: inset 3px 0 0 var(--other); }
.a-item.sport { background: var(--amber-soft); box-shadow: inset 3px 0 0 var(--amber); color: var(--amber-text); }
.a-item.strava { box-shadow: inset 3px 0 0 var(--strava); }
.a-item.train { background: var(--lime); color: var(--lime-ink); }
.a-item.train.done { background: var(--lime-soft); color: var(--lime-text); }
.a-item.train.missed { background: var(--danger-soft); color: var(--danger); }
.a-rest { font-size: 14px; color: var(--text-3); padding: 6px 0; }
@media (max-width: 720px) { .cal { display: none; } .agenda { display: block; } }

/* session cards */
.sessions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.scard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; display: grid; gap: 12px; align-content: start; position: relative; }
.scard.is-done { border-color: var(--lime-line); }
.scard-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.scard-top .label b { color: var(--text); font-weight: 700; }
.scard h3 { font-size: 22px; font-stretch: 118%; }
.scard h3 a { text-decoration: none; }
.scard h3 a:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.scard-meta { font-size: 14px; color: var(--text-2); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.scard-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 2px; }

/* the More menu */
.menu { position: relative; }
.menu > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 9px 12px; border-radius: var(--r-sm); font-weight: 600; font-size: 15px; color: var(--text-2); }
.menu > summary::-webkit-details-marker { display: none; }
.menu > summary::after { content: ''; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: translateY(-2px) rotate(45deg); }
.menu > summary:hover, .menu[open] > summary { color: var(--text); background: var(--surface-2); }
.menu-pop { position: absolute; z-index: 25; top: calc(100% + 6px); left: 0; min-width: 250px; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 6px; display: grid; gap: 2px; box-shadow: var(--shadow); }
.menu-pop button { border: 0; background: transparent; justify-content: flex-start; font-weight: 500; min-height: 42px; padding: 10px 12px; width: 100%; }
.menu-pop button:hover { background: var(--surface-3); }
.movebox { background: var(--surface-2); border-radius: var(--r-md); padding: 14px; display: grid; gap: 12px; }
.movebox .row { align-items: flex-end; }

/* check-in */
.checkin { background: var(--surface-2); border-radius: var(--r-md); padding: 14px 16px; display: grid; gap: 10px; }
.ci-title { font-weight: 700; font-size: 16px; }
.ci-row { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; align-items: center; }
.ci-label { font-size: 14.5px; color: var(--text-2); }
.ci-opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.ci-opts button { min-height: 42px; padding: 6px 8px; font-weight: 500; font-size: 15px; background: var(--surface); }
.ci-opts button[aria-pressed='true'] { background: var(--text); color: var(--bg); border-color: var(--text); }
.checkin.result.good { background: var(--lime-soft); }
.checkin.result.good .ci-title { color: var(--lime-text); }
.checkin.result.easy { background: var(--amber-soft); }
.checkin.result.easy .ci-title { color: var(--amber-text); }
.checkin.result.rough { background: var(--danger-soft); }
.checkin.result.rough .ci-title { color: var(--danger); }
.ci-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
@media (max-width: 460px) { .ci-row { grid-template-columns: 1fr; gap: 6px; } }

/* recap and install */
.recap { display: grid; gap: 14px; margin-bottom: 18px; }
.recap-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.recap h2 { font-size: 26px; }
.recap-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 0; }
.recap-stats div { background: var(--surface-2); border-radius: var(--r-md); padding: 12px 14px; display: grid; gap: 4px; }
.recap-stats dt { font-size: 13.5px; color: var(--text-2); }
.recap-stats dd { margin: 0; font-size: 28px; line-height: 1; }
.install { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--lime-soft); border: 1px solid var(--lime-line); border-radius: var(--r-lg); padding: 14px 18px; margin-bottom: 18px; }
.install b { font-weight: 700; font-size: 16px; }
.install p { margin-top: 2px; color: var(--text-2); }
.install-actions { display: flex; gap: 8px; }

/* ---------- Workout mode ---------- */
.wk { max-width: 860px; margin: 0 auto; }
.wk-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.wk-top .elapsed { font-size: 15px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.wk-title { display: grid; gap: 10px; margin-bottom: 18px; }
.wk-title .hero-when { font-weight: 600; color: var(--lime-text); }
.wk-title h1 { font-size: clamp(32px, 6vw, 52px); line-height: 0.98; }
.wk-progress { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; margin: 4px 0 18px; }
.wk-progress .num { font-size: 22px; }
.wk-progress .meter { height: 8px; }
.xlist { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 14px; }
.xcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; display: grid; gap: 12px; }
.xcard.is-done { border-color: var(--lime-line); }
.xcard.is-skipped { opacity: 0.7; }
.xhead { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.xnum { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; font-stretch: 75%; font-size: 18px; background: var(--surface-3); color: var(--text-2); }
.xcard.is-done .xnum { background: var(--lime); color: var(--lime-ink); }
.xname { font-weight: 700; font-size: 19px; font-stretch: 110%; line-height: 1.15; }
.xname small { display: block; font-weight: 500; font-stretch: 100%; font-size: 13.5px; color: var(--text-2); margin-top: 3px; }
.xtarget { font-weight: 700; font-stretch: 85%; font-size: 18px; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.xprev { font-size: 14.5px; color: var(--text-2); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.xprev .up { padding: 3px 9px; border-radius: 999px; background: var(--lime-soft); color: var(--lime-text); font-weight: 600; font-size: 13.5px; }
.xtools { display: flex; gap: 6px; flex-wrap: wrap; }
.toolbtn { min-height: 36px; padding: 6px 12px; font-size: 14px; font-weight: 600; color: var(--text-2); background: transparent; border: 1px solid var(--line-2); border-radius: 999px; }
.toolbtn[aria-expanded='true'] { color: var(--text); background: var(--surface-3); }
.toolpanel { background: var(--surface-2); border-radius: var(--r-md); padding: 14px; display: grid; gap: 10px; }
.swaplist { display: flex; flex-wrap: wrap; gap: 6px; }
.swaplist button { min-height: 40px; font-weight: 500; background: var(--surface); }
.warmlist { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.warmlist li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; font-size: 15px; font-variant-numeric: tabular-nums; }
.warmlist li span { color: var(--text-2); }
.warmlist li.work { padding-top: 8px; border-top: 1px solid var(--line); }
.sets { display: grid; gap: 6px; }
.sets-head, .set { display: grid; grid-template-columns: 34px minmax(0, 1fr) minmax(0, 1fr) 56px; gap: 8px; align-items: center; }
.sets-head span { font-size: 13px; color: var(--text-3); text-align: center; }
.sets-head span:first-child { text-align: left; }
.set > span { font-weight: 800; font-stretch: 75%; font-size: 18px; color: var(--text-3); text-align: center; }
.set input { min-height: 54px; text-align: center; font-size: 20px; font-weight: 700; font-stretch: 85%; font-variant-numeric: tabular-nums; background: var(--surface-2); }
.tick { min-height: 54px; padding: 0; font-size: 22px; color: var(--text-3); background: var(--surface-2); border-color: var(--line-2); border-radius: var(--r-sm); }
.tick[aria-pressed='true'] { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); animation: tick .3s cubic-bezier(.2, .8, .2, 1.4); }
@keyframes tick { 50% { transform: scale(1.12); } }
.set.is-done input { background: var(--lime-soft); border-color: transparent; color: var(--lime-text); }
.skipline { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 15px; color: var(--text-2); }
.wk-foot {
  position: sticky; bottom: 0; z-index: 12; margin-top: 22px; padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--bg) 70%, transparent); display: flex; gap: 10px; justify-content: flex-end;
}
.wk-foot .primary { flex: 0 1 280px; }
@media (max-width: 600px) {
  .xcard { padding: 14px; }
  .sets-head, .set { grid-template-columns: 26px minmax(0, 1fr) minmax(0, 1fr) 52px; gap: 6px; }
  .wk-foot .primary { flex: 1 1 auto; }
}

/* summary */
.done-hero { display: grid; gap: 12px; justify-items: start; padding: 30px 28px; }
.done-mark { width: 64px; height: 64px; border-radius: 18px; background: var(--lime); display: grid; place-items: center; animation: land .5s cubic-bezier(.2, .8, .2, 1.3); }
.done-mark svg { width: 34px; height: 34px; stroke: var(--lime-ink); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .45s .2s ease-out forwards; }
@keyframes land { from { transform: scale(.6); opacity: 0; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
.done-hero h1 { font-size: clamp(32px, 5vw, 48px); }
.summary-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
@media (max-width: 700px) { .summary-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* rest timer */
.rest {
  position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(560px, calc(100% - 24px)); background: var(--surface-3); color: var(--text); border: 1px solid var(--line-2);
  border-radius: 18px; overflow: hidden; box-shadow: var(--shadow);
}
.rest-bar { height: 4px; background: linear-gradient(90deg, var(--lime) var(--p), transparent var(--p)); }
.rest-body { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 12px 14px 12px 18px; }
.rest-time { font-weight: 800; font-stretch: 75%; font-size: 42px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 2.4em; }
.rest-text { display: grid; gap: 2px; min-width: 0; }
.rest-text b { font-weight: 700; }
.rest-text span { font-size: 14px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rest-actions { display: flex; gap: 6px; }
.rest-actions button { min-height: 44px; padding: 8px 12px; background: var(--surface-2); font-variant-numeric: tabular-nums; }
.rest-actions .primary { background: var(--lime); color: var(--lime-ink); }
.rest.over .rest-time { color: var(--lime-text); }
body.resting main#app { padding-bottom: calc(190px + env(safe-area-inset-bottom, 0px)); }
@media (max-width: 900px) { .rest { bottom: calc(82px + env(safe-area-inset-bottom, 0px)); } }
@media (max-width: 520px) { .rest-body { grid-template-columns: auto minmax(0, 1fr); } .rest-actions { grid-column: 1 / -1; } .rest-actions button { flex: 1; } }
body.focus .rest { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }

/* ---------- recovery ---------- */
.recovery { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 24px; align-items: start; }
.recovery.compact { grid-template-columns: minmax(0, 170px) minmax(0, 1fr); gap: 16px; }
@media (max-width: 700px) { .recovery, .recovery.compact { grid-template-columns: 1fr; } .bodies { max-width: 240px; margin-inline: auto; width: 100%; } }
.bodies { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.body { margin: 0; display: grid; gap: 6px; justify-items: center; }
.body svg { width: 100%; max-width: 150px; height: auto; }
.body figcaption { font-size: 13px; color: var(--text-3); }
.body polygon { stroke: var(--surface); stroke-width: 10; stroke-linejoin: round; transition: fill .35s, opacity .2s; }
.body polygon.b { fill: var(--fig); opacity: 0.55; }
.body polygon.m { fill: var(--rec-0); cursor: pointer; }
.body polygon.m.l1 { fill: var(--rec-1); } .body polygon.m.l2 { fill: var(--rec-2); } .body polygon.m.l3 { fill: var(--rec-3); }
.body polygon.m.nodata { fill: var(--fig); }
.body svg.has-sel polygon.m { opacity: 0.35; }

// ---------- building the library ----------
const exParse = (spec) => {
  const out = {};
  for (const tok of String(spec || '').split(/\s+/).filter(Boolean)) {
    const [name, w] = tok.split(':');
    const ids = BUNDLES[name] ? BUNDLES[name].split(' ') : [name];
    for (const id of ids) out[id] = w !== undefined ? Number(w) : null;
  }
  return out;
};
const exWithRole = (spec, role) => Object.fromEntries(Object.entries(exParse(spec)).map(([id, w]) => [id, w ?? ROLE_WEIGHT[role]]));

function exFromRow([id, name, aka, equipment, category, pattern, mech, track, load, p, s, st, cue]) {
  const primary = exWithRole(p, 'primary');
  const secondary = exWithRole(s, 'secondary');
  const stabilisers = exWithRole(st, 'stabiliser');
  // A muscle only appears in its strongest role.
  for (const k of Object.keys(primary)) { delete secondary[k]; delete stabilisers[k]; }
  for (const k of Object.keys(secondary)) delete stabilisers[k];
  return {
    id, name, aka: aka ? aka.split('|') : [], equipment, category, pattern,
    mechanics: mech === 'c' ? 'compound' : 'isolation', track: TRACK_CODE[track], load: LOAD_CODE[load],
    muscles: { primary, secondary, stabilisers }, cue,
  };
}

const BUILT_IN = ROWS.map(exFromRow);
let exAll = BUILT_IN.slice();
let exIndex = new Map();

// Names compare without case, punctuation, plurals or common shorthand (db, bb, kb).
function exNorm(name) {
  return ` ${String(name || '').toLowerCase()} `
    .replace(/[’'`]/g, '').replace(/[^a-z0-9]+/g, ' ')
    .replace(/ db /g, ' dumbbell ').replace(/ bb /g, ' barbell ').replace(/ kb /g, ' kettlebell ')
    .replace(/ ez bar /g, ' ezbar ').replace(/ ez /g, ' ezbar ')
    .trim().split(/ +/).map(exSingular).join(' ');
}
function exSingular(w) {
  if (w.length < 3 || !w.endsWith('s') || /(ss|us|is)$/.test(w)) return w;
  return /(ch|sh|x)es$/.test(w) ? w.slice(0, -2) : w.slice(0, -1);
}
const exSlugName = (move) => (String(move).startsWith('x_') ? String(move).slice(2).replace(/-/g, ' ') : null);

function exReindex() {
  exIndex = new Map();
  for (const ex of exAll) {
    for (const n of [ex.name, ...ex.aka]) {
      const k = exNorm(n);
      if (k && !exIndex.has(k)) exIndex.set(k, ex);
    }
  }
}
exReindex();

const allExercises = () => exAll;
const exerciseById = (id) => exAll.find((e) => e.id === id) || null;

// The library record for a name the user typed or a stored key, or null.
function findExercise(nameOrKey) {
  if (!nameOrKey) return null;
  const byId = exAll.find((e) => e.id === nameOrKey);
  if (byId) return byId;
  const slug = exSlugName(nameOrKey);
  return exIndex.get(exNorm(slug || nameOrKey)) || null;
}

// The user's own exercises join the library. Invalid ones are skipped, never thrown away.
function setCustomExercises(list) {
  const custom = (Array.isArray(list) ? list : []).filter((e) => e && !e.deleted && !validateExercise(e).length).map((e) => ({ ...e, custom: true }));
  exAll = [...BUILT_IN, ...custom];
  exReindex();
}

// Problems with an exercise record, as plain sentences. Empty means valid.
function validateExercise(e) {
  const errs = [];
  if (!e || typeof e !== 'object') return ['Not an exercise.'];
  if (!e.id || !/^[a-z0-9_-]+$/.test(e.id)) errs.push('Missing id.');
  if (!String(e.name || '').trim()) errs.push('Give it a name.');
  if (!EQUIPMENT[e.equipment]) errs.push('Pick the equipment.');
  if (!CATEGORIES[e.category]) errs.push('Pick a category.');
  if (!TRACKS[e.track]) errs.push('Pick how it’s tracked.');
  if (!LOADS[e.load]) errs.push('Pick what the weight means.');
  const m = e.muscles || {};
  const p = Object.keys(m.primary || {});
  if (!p.length) errs.push('Pick at least one main muscle.');
  for (const role of ['primary', 'secondary', 'stabilisers']) {
    for (const [id, w] of Object.entries(m[role] || {})) {
      if (!MUSCLE_INFO[id]) errs.push(`Unknown muscle: ${id}.`);
      if (!(Number(w) > 0 && Number(w) <= 1)) errs.push(`Weight for ${id} must be between 0 and 1.`);
    }
  }
  if (TRACKS[e.track] && !TRACKS[e.track].fields.includes('kg') && e.load !== 'none') errs.push('Exercises without a weight use “Bodyweight only”.');
  return errs;
}

// How much one set loads each detailed muscle.
function muscleWeights(ex) {
  const out = {};
  if (!ex) return out;
  for (const role of ['stabilisers', 'secondary', 'primary']) {
    for (const [id, w] of Object.entries(ex.muscles[role] || {})) out[id] = Math.max(out[id] || 0, Number(w) || 0);
  }
  return out;
}
// The same, rolled up to body-map groups (strongest detailed muscle wins).
function groupWeights(ex) {
  const out = {};
  for (const [id, w] of Object.entries(muscleWeights(ex))) {
    const g = MUSCLE_INFO[id] && MUSCLE_INFO[id].group;
    if (g) out[g] = Math.max(out[g] || 0, w);
  }
  return out;
}
const roleOf = (ex, muscle) => (ex.muscles.primary[muscle] ? 'primary' : ex.muscles.secondary[muscle] ? 'secondary' : ex.muscles.stabilisers[muscle] ? 'stabiliser' : null);
const exGroupsIn = (ex, roles) => new Set(roles.flatMap((r) => Object.keys(ex.muscles[r] || {})).map((id) => MUSCLE_INFO[id] && MUSCLE_INFO[id].group));

// Tags shown in the library and usable as the "type" filter.
function exerciseTypes(ex) {
  const t = [ex.mechanics === 'compound' ? 'Compound' : 'Isolation'];
  if (ex.track === 'duration' || ex.track === 'weight_duration' || ex.track === 'distance_duration') t.push('Timed');
  if (TRACKS[ex.track].fields.includes('kg') && ex.load !== 'assisted') t.push('Weighted');
  if (ex.equipment === 'bodyweight') t.push(ex.category === 'functional' ? 'Calisthenics' : 'Bodyweight');
  if (ex.equipment === 'band') t.push('Band');
  if (ex.category === 'functional' || ex.pattern === 'Carry' || ex.pattern === 'Explosive') t.push('Functional');
  if (ex.category === 'core') t.push('Core');
  return t;
}
const EXERCISE_TYPES = ['Compound', 'Isolation', 'Weighted', 'Bodyweight', 'Calisthenics', 'Band', 'Timed', 'Functional', 'Core'];

// Search by name, other names, muscles, equipment or movement, with filters.
function searchExercises(query = '', f = {}) {
  const q = exNorm(query);
  const words = q ? q.split(' ') : [];
  const out = [];
  for (const ex of exAll) {
    if (f.equipment && ex.equipment !== f.equipment) continue;
    if (f.fits && !equipmentFits(ex, f.fits)) continue;
    if (f.category && ex.category !== f.category) continue;
    if (f.mechanics && ex.mechanics !== f.mechanics) continue;
    if (f.type && !exerciseTypes(ex).includes(f.type)) continue;
    if (f.group && !exGroupsIn(ex, f.role ? [f.role === 'stabiliser' ? 'stabilisers' : f.role] : ['primary', 'secondary']).has(f.group)) continue;
    if (f.muscle) {
      const role = roleOf(ex, f.muscle);
      if (!role || (f.role && role !== f.role)) continue;
    }
    let score = 1;
    if (words.length) {
      const names = [ex.name, ...ex.aka].map(exNorm);
      const hay = `${names.join(' ')} ${ex.equipment} ${ex.category} ${exNorm(ex.pattern)} ${Object.keys(muscleWeights(ex)).map((id) => exNorm(MUSCLE_INFO[id].label)).join(' ')}`;
      if (names.includes(q)) score = 100;
      else if (names.some((n) => n.startsWith(q))) score = 80;
      else if (words.every((w) => names.some((n) => n.split(' ').some((t) => t.startsWith(w))))) score = 60;
      else if (words.every((w) => hay.includes(w))) score = 30;
      else continue;
    }
    out.push({ ex, score });
  }
  return out.sort((a, b) => b.score - a.score || a.ex.name.localeCompare(b.ex.name)).map((x) => x.ex);
}

// Exercises that share names closely enough to be the same thing (to stop duplicates).
function similarExercises(name, limit = 3) {
  const q = exNorm(name);
  if (!q) return [];
  const exact = findExercise(name);
  if (exact) return [exact];
  const qs = new Set(q.split(' '));
  return exAll.map((ex) => {
    const best = Math.max(...[ex.name, ...ex.aka].map((n) => {
      const t = new Set(exNorm(n).split(' '));
      const both = [...qs].filter((w) => t.has(w)).length;
      return both / new Set([...qs, ...t]).size;
    }));
    return { ex, best };
  }).filter((x) => x.best >= 0.6).sort((a, b) => b.best - a.best).slice(0, limit).map((x) => x.ex);
}

// A starting point for a new exercise's muscles, from the closest-sounding library exercise.
function suggestMapping(name) {
  const words = exNorm(name).split(' ').filter((w) => w.length > 2);
  if (!words.length) return null;
  let best = null;
  for (const ex of BUILT_IN) {
    const t = new Set([ex.name, ...ex.aka].flatMap((n) => exNorm(n).split(' ')));
    const hits = words.filter((w) => t.has(w)).length;
    if (hits && (!best || hits > best.hits)) best = { ex, hits };
  }
  return best ? best.ex : null;
}

// Swaps that train the same main muscles in a similar way, with kit the athlete has.
function alternativesFor(ex, { fits = 'gym', exclude = [], limit = 6 } = {}) {
  if (!ex) return [];
  const mine = muscleWeights(ex);
  const prim = Object.keys(ex.muscles.primary);
  const skip = new Set([ex.id, ...exclude.map((n) => (findExercise(n) || {}).id).filter(Boolean)]);
  const scored = [];
  for (const o of exAll) {
    if (skip.has(o.id) || !equipmentFits(o, fits)) continue;
    const theirs = muscleWeights(o);
    const primOverlap = prim.filter((id) => o.muscles.primary[id]).length / prim.length;
    if (primOverlap === 0) continue;
    let shared = 0;
    let total = 0;
    for (const id of new Set([...Object.keys(mine), ...Object.keys(theirs)])) {
      shared += Math.min(mine[id] || 0, theirs[id] || 0);
      total += Math.max(mine[id] || 0, theirs[id] || 0);
    }
    const score = primOverlap * 2 + shared / total + (o.pattern === ex.pattern ? 0.8 : 0) + (o.mechanics === ex.mechanics ? 0.3 : 0);
    scored.push({ o, score });
  }
  return scored.sort((a, b) => b.score - a.score).slice(0, limit).map((x) => x.o);
}

// ---------- sets ----------
const trackOf = (ex) => (ex && TRACKS[ex.track] ? ex.track : 'weight_reps');
// Seconds for a timed set. Older logs stored a plank's seconds in the reps box.
const secOf = (set, track) => {
  if (!set) return 0;
  if (set.sec !== undefined && set.sec !== '') return Number(set.sec) || 0;
  return track === 'duration' || track === 'weight_duration' ? Number(set.reps) || 0 : 0;
};
// Weight moved in one set, in kg: pairs of dumbbells count twice, assistance counts as nothing.
// Only weight-and-reps exercises have volume; timed and distance work is tracked on its own terms.
function volumeOf(set, ex) {
  const kg = Number(set && set.kg) || 0;
  const reps = Number(set && set.reps) || 0;
  if (!ex) return kg * reps;
  if (ex.track !== 'weight_reps' && ex.track !== 'reps') return 0;
  if (ex.load === 'assisted') return 0;
  return kg * reps * (ex.load === 'pair' ? 2 : 1);
}

// ---------- what a stored key means ----------
// The app tells the library how to turn a logged key (a movement slot or an exercise key) into a name.
let exMoveName = (move) => exSlugName(move) || move;
function setMoveResolver(fn) { exMoveName = fn; }
function exerciseForMove(move, name) {
  return findExercise(name) || findExercise(exMoveName(move)) || findExercise(move);
}

// Seconds or reps a prescription asks for, e.g. "30–45s" -> 30 seconds.
function targetOf(reps) {
  const s = String(reps || '');
  const nums = (s.match(/\d+/g) || []).map(Number);
  if (/s\b|sec|min/.test(s)) return { sec: /min/.test(s) ? (nums[0] || 1) * 60 : nums[0] || 30 };
  if (/m\b|metre|meter/.test(s)) return { m: nums[0] || 20 };
  return { reps: nums[0] || 8, high: nums[nums.length - 1] || nums[0] || 8 };
}

// ---- js/units.js ----
// Kilograms or pounds. Weights are always stored in kg; these convert for showing and typing.
const LB_PER_KG = 1 / 0.45359237;
const PLATES_LB = [45, 35, 25, 10, 5, 2.5];
const unitRound = (v, step) => Math.round(v / step) * step;
const unitTidy = (v) => Math.round(v * 1000) / 1000;

const isLb = (units) => units === 'lb';
const unitLabel = (units) => (isLb(units) ? 'lb' : 'kg');

// Stored kg -> the number shown. Empty stays empty.
function fromKg(kg, units) {
  if (kg === '' || kg === null || kg === undefined) return '';
  const n = Number(kg);
  if (!Number.isFinite(n)) return '';
  return isLb(units) ? unitTidy(unitRound(n * LB_PER_KG, 0.1)) : unitTidy(unitRound(n, 0.01));
}
// A number typed in the user's unit -> kg to store.
function toKg(v, units) {
  if (v === '' || v === null || v === undefined) return '';
  const n = Number(v);
  if (!Number.isFinite(n)) return '';
  return isLb(units) ? unitTidy(n / LB_PER_KG) : n;
}
// "62.5 kg" / "135 lb".
const fmtWeight = (kg, units) => `${fromKg(kg, units)} ${unitLabel(units)}`;

// Bar, plates and steps in the user's unit. The bar setting is stored as 20 or 15 kg.
const barFor = (units, barKg = 20) => (isLb(units) ? (Number(barKg) === 15 ? 35 : 45) : Number(barKg) || 20);
const platesFor = (units, kgPlates) => (isLb(units) ? PLATES_LB : kgPlates);

const toMin = (hhmm) => {

const toHHMM = (min) => {
  const h = Math.floor(min / 60);

// Which built-in movement an exercise name belongs to, e.g. 'Goblet squat' -> 'squat'.
function moveKeyForName(name) {
  const n = String(name || '').trim().toLowerCase();
  for (const names of Object.values(MOVES)) for (const [m, label] of Object.entries(names)) if (label.toLowerCase() === n) return m;
  return null;
}

const moveName = (move, equipment) => CUSTOM_NAMES[move] || (MOVES[equipment] || MOVES.gym)[move] || move;

const PRIMARY = new Set(['squat', 'hinge', 'horizontalPush', 'verticalPush', 'horizontalPull', 'verticalPull']);

const PRESCRIPTION = {
  strength: { primary: [4, '5'], accessory: [3, '8'] },
  muscle: { primary: [3, '8–10'], accessory: [3, '10–12'] },
  fitness: { primary: [3, '12'], accessory: [2, '15'] },
  sport: { primary: [4, '4–6'], accessory: [3, '8'] },
};

function exercisesFor(sessionKey, profile, short = false) {
  const custom = CUSTOM[baseKey(sessionKey)];
  if (custom) {
    const list = custom.exercises.map(({ move, name, sets, reps }) => ({ move, name, sets, reps }));
    return short ? list.slice(0, 3) : list;
  }
  const s = SESSIONS[baseKey(sessionKey)];
  const names = MOVES[profile.equipment] || MOVES.gym;
  const rx = PRESCRIPTION[profile.goal] || PRESCRIPTION.muscle;
  const beginner = profile.level === 'beginner';
  const moves = short ? s.moves.slice(0, 3) : s.moves;
  return moves.map((m) => {
    const isPrimary = PRIMARY.has(m);
    let [sets, reps] = isPrimary ? rx.primary : rx.accessory;
    if (beginner) sets = Math.max(2, sets - 1);
    if (m === 'core') reps = '30–45s';
    return { move: m, name: names[m], sets, reps };
  });
}

// ---------- custom routines ----------
// People who already have a program enter it; the scheduler places it the same way.
const GROUPS = ['chest', 'back', 'shoulders', 'arms', 'legs', 'core'];
const GROUP_OF = {
  squat: 'legs', hinge: 'legs', singleLeg: 'legs', glutes: 'legs', calves: 'legs',
  horizontalPush: 'chest', inclinePush: 'chest', verticalPush: 'shoulders', lateral: 'shoulders', rearDelt: 'shoulders',
  horizontalPull: 'back', verticalPull: 'back', biceps: 'arms', triceps: 'arms', core: 'core',
};
const EXTRA_EXERCISES = {
  'Deadlift': 'legs', 'Leg press': 'legs', 'Leg curl': 'legs', 'Leg extension': 'legs', 'Front squat': 'legs',
  'Chest fly': 'chest', 'Dips': 'chest', 'Cable crossover': 'chest',
  'Barbell row': 'back', 'Chin-up': 'back', 'Shrug': 'back', 'T-bar row': 'back',
  'Arnold press': 'shoulders', 'Upright row': 'shoulders',
  'Hammer curl': 'arms', 'Barbell curl': 'arms', 'Skull crusher': 'arms', 'Close-grip bench press': 'arms',
  'Hanging leg raise': 'core', 'Cable crunch': 'core', 'Ab wheel rollout': 'core',
};

function exerciseLibrary() {
  const lib = new Map();
  for (const names of Object.values(MOVES)) for (const [m, n] of Object.entries(names)) if (!lib.has(n)) lib.set(n, GROUP_OF[m]);
  for (const [n, g] of Object.entries(EXTRA_EXERCISES)) if (!lib.has(n)) lib.set(n, g);
  return [...lib].map(([name, group]) => ({ name, group })).sort((a, b) => a.name.localeCompare(b.name));
}

const exerciseKey = (name) => `x_${String(name).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')}`;

const CUSTOM = {};
const CUSTOM_NAMES = {};
const baseKey = (key) => String(key).split('#')[0];

// Turn the user's routine into session definitions the planner understands.
function setCustomRoutine(routine) {
  for (const k of Object.keys(CUSTOM)) delete CUSTOM[k];
  for (const w of (routine && routine.workouts) || []) {
    const exercises = (w.exercises || []).filter((e) => e.name && e.name.trim()).map((e) => ({
      move: exerciseKey(e.name), name: e.name.trim(),
      sets: Math.max(1, Math.min(10, Math.round(Number(e.sets)) || 3)),
      reps: String(e.reps || '').trim() || '8–12',
      group: GROUPS.includes(e.group) ? e.group : 'core',
    }));
    exercises.forEach((e) => { CUSTOM_NAMES[e.move] = e.name; });
    const legCount = exercises.filter((e) => e.group === 'legs').length;
    CUSTOM[`c_${w.id}`] = {
      name: (w.name || '').trim() || 'Workout',
      groups: [...new Set(exercises.map((e) => e.group).filter((g) => g !== 'core'))],
      legs: legCount === 0 ? 'none' : legCount * 2 >= exercises.length ? 'heavy' : 'some',
      exercises,
    };
  }
}
// Names of exercises that were logged but later removed from the routine.
function rememberExerciseNames(map) { Object.assign(CUSTOM_NAMES, map || {}); }
const customExerciseNames = () => ({ ...CUSTOM_NAMES });

const isCustom = (key) => !!CUSTOM[baseKey(key)];
function sessionInfo(key) {
  const b = baseKey(key);
  return SESSIONS[b] || CUSTOM[b] || { name: 'Workout', groups: [], legs: 'none', moves: [] };
}

// Which workouts this week gets. Custom routines rotate in order and carry on where last week stopped.
function routineKeys(profile, routine, weekIndex = 0, busy = false) {
  const ids = ((routine && routine.workouts) || []).map((w) => `c_${w.id}`).filter((k) => CUSTOM[k] && CUSTOM[k].exercises.length);
  if (!ids.length) return null;
  const perWeek = profile.sessionsPerWeek;
  const n = busy ? busyCount(perWeek) : perWeek;
  const start = (((weekIndex * perWeek) % ids.length) + ids.length) % ids.length;
  const seen = {};
  const out = [];
  for (let i = 0; i < n; i++) {
    const k = ids[(start + i) % ids.length];
    seen[k] = (seen[k] || 0) + 1;
    out.push(seen[k] > 1 ? `${k}#${seen[k]}` : k);
  }
  return out;
}

// ---------- weeks ----------
function mondayOf(date) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const offset = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - offset);
  return d;
}
function weekKey(date) {
  const d = mondayOf(date);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function keyToDate(key) {
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function addWeeks(key, n) {
  const d = keyToDate(key);
  d.setDate(d.getDate() + n * 7);
  return weekKey(d);
}
function weeksBetween(aKey, bKey) {
  return Math.round((keyToDate(bKey) - keyToDate(aKey)) / (7 * 864e5));
}
// Which template (A or B) a given week uses.
function weekType(key, abAnchor) {
  if (!abAnchor) return 'A';
  const diff = weeksBetween(abAnchor.week, key);
  const flip = ((diff % 2) + 2) % 2 === 1;
  return flip ? (abAnchor.type === 'A' ? 'B' : 'A') : abAnchor.type;
}

// ---------- free slots ----------
const BUFFER = 15; // travel / change time either side of a commitment
const SHORT_MIN = 30;

function freeGaps(blocks, day, window) {
  const start = toMin(window.start);
  const end = toMin(window.end);
  const busy = blocks
    .filter((b) => b.day === day)
    .map((b) => [Math.max(start, toMin(b.start) - BUFFER), Math.min(end, toMin(b.end) + BUFFER)])
    .filter(([a, b]) => b > a)
    .sort((x, y) => x[0] - y[0]);
  const gaps = [];
  let cursor = start;
  for (const [a, b] of busy) {
    if (a > cursor) gaps.push([cursor, a]);
    cursor = Math.max(cursor, b);
  }
  if (end > cursor) gaps.push([cursor, end]);
  return gaps;
}

// Preference for a start time: lower is better. `when` is the athlete's preferred time of day.
const TIME_PREFS = ['afternoon', 'morning', 'evening'];
function timePref(t, when = 'afternoon') {
  const h = t / 60;
  if (when === 'morning') {
    if (h >= 7 && h < 9) return 0;
    if (h >= 5 && h < 7) return 0.3;
    if (h >= 9 && h < 12) return 1;
    if (h >= 15 && h < 18) return 2.5;
    if (h >= 18 && h < 20) return 3;
    return 3.5;
  }
  if (when === 'evening') {
    if (h >= 18 && h < 21) return 0;
    if (h >= 15 && h < 18) return 1;
    if (h >= 9 && h < 12) return 1.5;
    if (h >= 6 && h < 8) return 3;
    return 3.5;
  }
  if (h >= 15 && h < 18) return 0;
  if (h >= 9 && h < 12) return 1;
  if (h >= 18 && h < 20) return 1.5;
  if (h >= 6 && h < 8) return 4; // early mornings only when they'd otherwise go without
  return 4;
}

const ANCHORS = [16 * 60, 9 * 60, 17 * 60, 10 * 60, 7 * 60, 18 * 60, 18 * 60 + 30, 19 * 60, 6 * 60 + 30];

// Best slot for a day: full-length if possible, else a short slot (>= 30 min), else null.
function bestSlot(blocks, day, window, length, when = 'afternoon') {
  const gaps = freeGaps(blocks, day, window);
  let best = null;
  const consider = (start, len, short) => {
    const pref = timePref(start, when) + (short ? 10 : 0);
    if (!best || pref < best.pref || (pref === best.pref && start < best.start)) {
      best = { start, end: start + len, short, pref };
    }
  };
  for (const [a, b] of gaps) {
    if (b - a >= length) {
      consider(a, length, false);
      for (const t of ANCHORS) if (t >= a && t + length <= b) consider(t, length, false);
    }
  }
  if (best) return best;
  for (const [a, b] of gaps) {
    const len = b - a;
    if (len >= SHORT_MIN) consider(a, Math.min(len, length), true);
  }
  return best;
}

// ---------- the planner ----------
function sportOn(blocks, day) {
  const sport = blocks.filter((b) => b.day === day && b.type === 'sport');
  if (!sport.length) return null;
  const hard = sport.find((b) => b.intensity === 'hard');
  return hard || sport[0];
}

function permutations(days, n) {
  const out = [];
  const used = new Array(days.length).fill(false);
  const cur = [];
  const rec = () => {
    if (cur.length === n) { out.push(cur.slice()); return; }
    for (let i = 0; i < days.length; i++) {
      if (used[i]) continue;
      used[i] = true; cur.push(days[i]);
      rec();
      used[i] = false; cur.pop();
    }
  };
  rec();
  return out;
}

const shares = (a, b) => sessionInfo(a).groups.some((g) => sessionInfo(b).groups.includes(g));

function legPenalty(sessionKey, sport, dayBefore) {
  if (!sport) return 0;
  const legs = sessionInfo(sessionKey).legs;
  const hard = sport.intensity === 'hard';
  const base = legs === 'heavy' ? (dayBefore ? 60 : 80) : legs === 'some' ? (dayBefore ? 25 : 40) : 0;
  return hard ? base : base / 4;
}

// fixed: sessions already locked in place this week ({ key, day }); they count for spacing but aren't moved.
function scoreAssignment(order, assignment, ctx) {
  const { slots, sport, fixed = [] } = ctx;
  let score = 0;
  const gymDay = new Array(7).fill(null);
  const placed = new Array(7).fill(false);
  fixed.forEach((f) => { gymDay[f.day] = f.key; });
  assignment.forEach((d, i) => { gymDay[d] = order[i]; placed[d] = true; });

  for (let d = 0; d < 7; d++) {
    const s = gymDay[d];
    if (!s) continue;
    if (placed[d]) {
      score += slots[d].pref * 2;
      score += legPenalty(s, sport[d], false);
      score += legPenalty(s, sport[(d + 1) % 7], true) * (d === 6 ? 0.6 : 1);
      if (sport[d] && sport[d].intensity === 'hard') score += 6;
    }
    const next = gymDay[(d + 1) % 7];
    if (next && (placed[d] || placed[(d + 1) % 7])) {
      if (shares(s, next)) score += d === 6 ? 30 : 50;
      score += 6; // back-to-back days: fine for different muscles, but spread out when there's room
    }
  }

  // Runs of hard days (gym or hard sport), counted around the week.
  const hard = gymDay.map((s, d) => !!s || (sport[d] && sport[d].intensity === 'hard'));
  if (hard.every(Boolean)) score += 100;
  else {
    const startIdx = hard.findIndex((h) => !h);
    let run = 0;
    for (let k = 1; k <= 7; k++) {
      const d = (startIdx + k) % 7;
      if (hard[d]) run++;
      else { if (run > 2) score += (run - 2) * 25; run = 0; }
    }
  }

  // Mild preference for keeping the split's order through the week.
  for (let i = 0; i < assignment.length; i++)
    for (let j = i + 1; j < assignment.length; j++)
      if (assignment[i] > assignment[j]) score += 0.5;

  return score;
}

function hardRuns(plan, sport) {
  const hard = new Array(7).fill(false);
  plan.forEach((p) => { hard[p.day] = true; });
  sport.forEach((s, d) => { if (s && s.intensity === 'hard') hard[d] = true; });
  const runs = [];
  let start = -1;
  for (let d = 0; d <= 7; d++) {
    if (d < 7 && hard[d]) { if (start < 0) start = d; }
    else if (start >= 0) { if (d - start >= 3) runs.push([start, d - 1]); start = -1; }
  }
  return runs;
}

function combinations(items, k) {
  const out = [];
  const rec = (start, cur) => {
    if (cur.length === k) { out.push(cur.slice()); return; }
    for (let i = start; i < items.length; i++) { cur.push(items[i]); rec(i + 1, cur); cur.pop(); }
  };
  rec(0, []);
  return out;
}

// Busy weeks: fewer, shorter full-body sessions that keep the main lifts going.
const busyCount = (n) => (n >= 5 ? 3 : 2);
const BUSY_LENGTH = 45;

function sessionKeysFor(profile, busy) {
  if (busy) return SPLITS[busyCount(profile.sessionsPerWeek)];
  return SPLITS[profile.sessionsPerWeek] || SPLITS[3];
}

/**
 * Build or rebuild a week plan.
 * @param {object} profile  { goal, level, equipment, sessionsPerWeek, sessionLength }
 * @param {Array}  blocks   commitments for this week's template: { day, start, end, type, label, intensity }
 * @param {object} window   { start: 'HH:MM', end: 'HH:MM' } earliest and latest training times
 * @param {object} opts
 *   keys     session keys to place (defaults to the profile's split)
 *   fixed    sessions locked in place: [{ key, day, start, end, short }]
 *   fromDay  first day (0 = Monday) new sessions may go on
 *   nowMin   minutes past midnight now; sessions on fromDay must start after this
 *   busy     busy week: shorter sessions, main lifts only
 *   skipDays days the user can't train this week
 *   keepOrder keep sessions in the given order through the week (custom routines)
 */
function planWeek(profile, blocks, window, opts = {}) {
  const busy = !!opts.busy;
  const keys = opts.keys || sessionKeysFor(profile, busy);
  const fixed = opts.fixed || [];
  const fromDay = opts.fromDay || 0;
  const replanning = fixed.length > 0 || fromDay > 0 || !!(opts.skipDays && opts.skipDays.length);
  const length = busy ? Math.min(BUSY_LENGTH, profile.sessionLength) : profile.sessionLength;
  const warnings = [];
  const slots = [];
  const sport = [];
  for (let d = 0; d < 7; d++) {
    sport[d] = sportOn(blocks, d);
    let win = window;
    if (opts.nowMin != null && d === fromDay) {
      const earliest = Math.ceil((opts.nowMin + 15) / 15) * 15;
      if (earliest >= toMin(window.end)) { slots[d] = null; continue; }
      win = { start: toHHMM(Math.max(toMin(window.start), earliest)), end: window.end };
    }
    slots[d] = bestSlot(blocks, d, win, length, profile.timeOfDay);
  }
  const fixedDays = new Set(fixed.map((f) => f.day));
  const available = [];
  const skip = new Set(opts.skipDays || []);
  for (let d = fromDay; d < 7; d++) if (slots[d] && !fixedDays.has(d) && !skip.has(d)) available.push(d);

  // Pick which sessions to keep when there aren't enough days, then where they go.
  const n = Math.min(keys.length, available.length);
  const ctx = { slots, sport, fixed };
  let best = null;
  if (n > 0) {
    for (const kept of combinations(keys, n)) {
      for (const assignment of permutations(available, n)) {
        if (opts.keepOrder && assignment.some((d, i) => i > 0 && d < assignment[i - 1])) continue;
        const score = scoreAssignment(kept, assignment, ctx);
        if (!best || score < best.score) best = { kept, assignment, score };
      }
    }
  }
  const kept = best ? best.kept : [];
  const dropped = keys.filter((k) => !kept.includes(k));

  const makeSession = (key, day, slot, extraNotes = []) => {
    const notes = [];
    const today = sport[day];
    const tomorrow = sport[(day + 1) % 7];
    if (today) notes.push(`${today.label || 'Sport'} today`);
    if (tomorrow && tomorrow.intensity === 'hard' && sessionInfo(key).legs === 'none')
      notes.push(`Upper body only, ${tomorrow.label || 'sport'} tomorrow`);
    if (slot.short) notes.push(`Short version, only ${slot.end - slot.start} minutes free`);
    else if (busy) notes.push('Busy week: main lifts only');
    return {
      key, name: sessionInfo(key).name, day, start: slot.start, end: slot.end,
      short: slot.short || busy, notes: [...notes, ...extraNotes],
      exercises: exercisesFor(key, profile, slot.short || busy),
    };
  };

  const placed = kept.map((key, i) => makeSession(key, best.assignment[i], slots[best.assignment[i]]));

  // Fold the main lifts from sessions that didn't fit into the closest match that did.
  for (const key of dropped) {
    if (!placed.length) break;
    const overlap = (s) => sessionInfo(key).groups.filter((g) => sessionInfo(s.key).groups.includes(g)).length;
    const target = placed.slice().sort((a, b) => overlap(b) - overlap(a) || a.day - b.day)[0];
    const have = new Set(target.exercises.map((x) => x.move));
    const pool = exercisesFor(key, profile, true);
    const extra = (isCustom(key) ? pool : pool.filter((x) => PRIMARY.has(x.move))).filter((x) => !have.has(x.move)).slice(0, 2);
    target.exercises.push(...extra.map((x) => ({ ...x, from: key })));
    target.notes.push(`Includes key lifts from ${sessionInfo(key).name}`);
    target.merged = [...(target.merged || []), key];
  }

  if (!replanning && available.length < keys.length) {
    warnings.push({
      kind: 'capacity',
      text: `Only ${available.length} day${available.length === 1 ? ' has' : 's have'} free time for training, so this week has ${available.length} session${available.length === 1 ? '' : 's'} instead of ${keys.length}.`,
    });
  } else if (dropped.length && placed.length) {
    warnings.push({ kind: 'merged', text: `Not enough days left for ${dropped.map((k) => sessionInfo(k).name).join(' and ')}, so the main lifts moved into another session.` });
  }
  if (!placed.length && dropped.length) {
    warnings.push({ kind: 'none', text: `No free time left this week for ${dropped.map((k) => sessionInfo(k).name).join(' or ')}. Pick it up next week.` });
  }

  for (const s of placed) {
    const legs = sessionInfo(s.key).legs;
    const today = sport[s.day];
    const tomorrow = sport[(s.day + 1) % 7];
    if (legs === 'heavy' && today && today.intensity === 'hard')
      warnings.push({ kind: 'legs', text: `${s.name} lands on the same day as ${today.label || 'hard sport'}. There was no better day free; keep the leg work light.` });
    else if (legs === 'heavy' && tomorrow && tomorrow.intensity === 'hard')
      warnings.push({ kind: 'legs', text: `${s.name} is the day before ${tomorrow.label || 'hard sport'}. There was no better day free; go easy on volume.` });
  }
  const all = [...fixed, ...placed].sort((a, b) => a.day - b.day);
  for (const [a, b] of hardRuns(all, sport)) {
    if (b < fromDay) continue;
    warnings.push({ kind: 'run', text: `${b - a + 1} hard days in a row, ${DAYS_SHORT[a]} to ${DAYS_SHORT[b]}. Keep ${DAYS[b]} lighter if you feel flat.` });
  }

  return { sessions: placed.sort((a, b) => a.day - b.day), dropped, warnings, split: keys };
}

// ---------- streaks ----------
// A week counts when completed gym sessions, plus up to one sport session, reach the target.
function weekMet(entry, target, sportCredit) {
  const done = entry ? entry.done.length : 0;
  return done + Math.min(1, sportCredit) >= target;
}

// target: a number, or a function of the week key (busy weeks have a lower target).
function streakInfo(history, currentKey, target, sportCreditFor) {
  const targetFor = typeof target === 'function' ? target : () => target;
  const met = (k) => weekMet(history[k], targetFor(k), sportCreditFor(k));
  let current = 0;
  let k = addWeeks(currentKey, -1);
  while (history[k] && met(k)) { current++; k = addWeeks(k, -1); }
  const thisWeek = met(currentKey);
  if (thisWeek) current++;

  const keys = Object.keys(history).sort();
  let longest = 0;
  if (keys.length) {
    let run = 0;
    let w = keys[0];
    while (w <= currentKey) {
      if (history[w] && met(w)) { run++; longest = Math.max(longest, run); }
      else if (w !== currentKey) run = 0;
      w = addWeeks(w, 1);
    }
  }
  return { current, longest: Math.max(longest, current), thisWeekMet: thisWeek };
}
