<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daybook</title>
  <meta name="description" content="Notes and reminders for every day.">
  <meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E1E20" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Daybook">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
    <aside class="inspector" id="inspector" hidden></aside>
  </div>

  <div class="compact" id="compact"></div>

  <div class="menu" id="menu" hidden role="menu"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="alerts" id="alerts" aria-live="assertive"></div>

  <dialog class="sheet" id="settings"></dialog>
  <dialog class="sheet" id="welcome"></dialog>
  <dialog class="sheet small" id="confirm"></dialog>

  <noscript>Daybook needs JavaScript turned on.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
